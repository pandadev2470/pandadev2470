<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">ClaretHub.com</title>
  <desc id="desc">Minimal blue rounded-square icon with a white C and the ClaretHub.com wordmark.</desc>
  <defs>
    <linearGradient id="iconBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#079bff"/>
      <stop offset="100%" stop-color="#0875ff"/>
    </linearGradient>
    <linearGradient id="domainBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#087cff"/>
      <stop offset="100%" stop-color="#08b8ef"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="224" height="224" rx="52" fill="url(#iconBlue)"/>
  <text x="120" y="158" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="126" font-weight="700" fill="#ffffff">C</text>

  <text x="270" y="151" font-family="Arial, Helvetica, sans-serif" font-size="100" font-weight="700" letter-spacing="-3" fill="#f8fafc">ClaretHub<tspan fill="url(#domainBlue)">.com</tspan></text>
</svg>
